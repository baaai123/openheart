# Redis configuration for OpenHeart project
# v4.5.0 §3.2.2 — Hot Memory persistence

# Basic
daemonize yes
port 6379
bind 127.0.0.1

# Persistence — AOF
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Persistence — RDB (also enabled for hybrid)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Keyspace
databases 16

# Max memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# AOF directory
dir /home/baaai/projects/openheart/config/redis/data
