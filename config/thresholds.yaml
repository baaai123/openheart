# v4.5.0 — Thresholds and safety patterns
# All thresholds used across perception, fusion, decision, and execution layers.

emotion_intensity_threshold: 0.5
entity_align_threshold: 0.75
max_window_ms: 800
min_window_ms: 150
idle_threshold_s: 5
onset_holdoff_ms: 250
pre_roll_ms: 200
buffer_duration_sec: 1.5

safety:
  sensitive_patterns:
    - "1[3-9]\\d{9}"              # Chinese mobile phone number
    - "\\d{17}[\\dXx]"            # Chinese ID card number
    - "(password|passwd|pwd)\\s*[:=]\\s*\\S+"  # Password leakage

prediction:
  min_confidence_for_proactive: 0.6
