<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OpenHeart Backend Config</title>
<style>
:root {
  --bg: #0d0d15;
  --surface: #161622;
  --surface2: #1e1e32;
  --border: #2a2a40;
  --text: #e8e8f0;
  --text2: #a0a0b8;
  --muted: #6c6c88;
  --primary: #6c5ce7;
  --primary-glow: rgba(108,92,231,.25);
  --accent: #00d4aa;
  --warn: #f59e0b;
  --danger: #ff4477;
  --radius: 10px;
  --font: system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
  background: var(--surface);
}
header .logo {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}
header h1 { font-size: 14px; font-weight: 600; }

/* ── Scrollable content ── */
.scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Section cards ── */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}
.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--muted);
  margin-bottom: 10px;
}
.field {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.field:last-child { margin-bottom: 0; }
.field label {
  width: 60px;
  font-size: 12px;
  color: var(--text2);
  flex-shrink: 0;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="password"] {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  outline: none;
  transition: border-color .2s;
}
.field input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
}
.field input:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* ── Textarea ── */
textarea {
  width: 100%;
  min-height: 80px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text);
  font-family: var(--font);
  font-size: 12px;
  outline: none;
  resize: vertical;
  transition: border-color .2s;
}
textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
}

/* ── Toggle switch ── */
.toggle {
  width: 36px; height: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  flex-shrink: 0;
}
.toggle.active {
  background: var(--primary);
  border-color: var(--primary);
}
.toggle::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: var(--text);
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: transform .2s;
}
.toggle.active::after {
  transform: translateX(16px);
  background: #fff;
}

/* ── Status dots ── */
.status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.status-row:last-child { margin-bottom: 0; }
.status-label {
  width: 70px;
  font-size: 12px;
  color: var(--text2);
}
.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.green { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.5); }
.status-dot.red { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,.5); }
.status-dot.yellow { background: #eab308; box-shadow: 0 0 6px rgba(234,179,8,.5); }
.status-text { font-size: 12px; color: var(--text2); }

/* ── Buttons ── */
.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text);
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
}
.btn:hover {
  border-color: var(--primary);
  background: var(--primary-glow);
}
.btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}
.btn:disabled:hover {
  border-color: var(--border);
  background: var(--surface2);
}
.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.btn.primary:hover {
  background: #7c6ff0;
}

/* ── Start button (big) ── */
.start-btn {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .5px;
  border-radius: var(--radius);
}

/* ── Progress bar ── */
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 3px;
  transition: width .4s ease;
}
.progress-text {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  text-align: center;
}

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  padding: 6px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text2);
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  z-index: 999;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<header>
  <div class="logo">O</div>
  <h1>OpenHeart Backend Config</h1>
</header>

<div class="scroll">

  <!-- ── API Config ── -->
  <div class="section">
    <div class="section-title">API Config</div>
    <div class="field">
      <label>Base URL</label>
      <input type="text" id="api-baseurl" placeholder="http://localhost:8000">
    </div>
    <div class="field">
      <label>Model</label>
      <input type="text" id="api-model" placeholder="gpt-4o">
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="api-key" placeholder="sk-...">
    </div>
  </div>

  <!-- ── Persona ── -->
  <div class="section">
    <div class="section-title">Persona</div>
    <textarea id="persona-prompt" placeholder="Enter system prompt for the AI assistant..."></textarea>
  </div>

  <!-- ── Module Switches ── -->
  <div class="section">
    <div class="section-title">Modules</div>
    <div class="field">
      <label>Voice</label>
      <div class="toggle active" id="tog-voice"></div>
    </div>
    <div class="field">
      <label>Visual</label>
      <div class="toggle active" id="tog-visual"></div>
    </div>
    <div class="field">
      <label>L2D</label>
      <div class="toggle active" id="tog-l2d"></div>
    </div>
  </div>

  <!-- ── Status Panel ── -->
  <div class="section">
    <div class="section-title">Status</div>
    <div class="status-row">
      <span class="status-label">Backend</span>
      <span class="status-dot red" id="status-backend-dot"></span>
      <span class="status-text" id="status-backend-text">Offline</span>
    </div>
    <div class="status-row">
      <span class="status-label">L2D</span>
      <span class="status-dot red" id="status-l2d-dot"></span>
      <span class="status-text" id="status-l2d-text">Offline</span>
    </div>
  </div>

  <!-- ── START BACKEND ── -->
  <button class="btn primary start-btn" id="btn-start">▶ START BACKEND</button>

  <!-- ── Progress ── -->
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="progress-text" id="progress-text">Ready</div>

</div>

<div id="toast"></div>

<script src="config_renderer.js"></script>
</body>
</html>
