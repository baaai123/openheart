<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OpenHeart Control Panel</title>
<style>
:root {
  --bg: #0d0d15;
  --surface: #161622;
  --surface2: #1e1e32;
  --border: #2a2a40;
  --text: #e8e8f0;
  --text2: #a0a0b8;
  --muted: #6c6c88;
  --primary: #6c5ce7;
  --primary-glow: rgba(108,92,231,.25);
  --accent: #00d4aa;
  --warn: #f59e0b;
  --danger: #ff4477;
  --radius: 10px;
  --font: system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
  background: var(--surface);
}
header .logo {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}
header h1 { font-size: 14px; font-weight: 600; }

/* ── Scrollable content ── */
.scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Section cards ── */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}
.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--muted);
  margin-bottom: 10px;
}
.field {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.field:last-child { margin-bottom: 0; }
.field label {
  width: 50px;
  font-size: 12px;
  color: var(--text2);
  flex-shrink: 0;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="password"] {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  outline: none;
  transition: border-color .2s;
}
.field input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-glow);
}
.field input:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* ── Toggle switch ── */
.toggle {
  width: 36px; height: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  flex-shrink: 0;
}
.toggle.active {
  background: var(--primary);
  border-color: var(--primary);
}
.toggle::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: var(--text);
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: transform .2s;
}
.toggle.active::after {
  transform: translateX(16px);
  background: #fff;
}

/* ── Buttons ── */
.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text);
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
}
.btn:hover {
  border-color: var(--primary);
  background: var(--primary-glow);
}
.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.btn.primary:hover {
  background: #7c6ff0;
}
.btn-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}

/* ── Expression buttons ── */
.expr-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface2);
  color: var(--text2);
  font-family: var(--font);
  font-size: 11px;
  cursor: pointer;
  transition: .2s;
}
.expr-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(0, 212, 170, .1);
}

/* ── Info / note ── */
.note {
  font-size: 11px;
  color: var(--warn);
  margin-top: 6px;
  line-height: 1.4;
}
.info-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  padding: 4px 0;
}
.info-row .lbl { color: var(--text2); }
.info-row .val { color: var(--muted); font-family: var(--mono); font-size: 11px; }

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  padding: 6px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text2);
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  z-index: 999;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<header>
  <div class="logo">O</div>
  <h1>Control Panel</h1>
</header>

<div class="scroll">

  <!-- ── Connection ── -->
  <div class="section">
    <div class="section-title">Connection</div>
    <div class="field">
      <label>Host</label>
      <input type="text" id="ws-host" placeholder="localhost">
    </div>
    <div class="field">
      <label>Port</label>
      <input type="number" id="ws-port" placeholder="9876" min="1" max="65535">
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btn-reconnect">Reconnect</button>
      <span id="ws-status" style="font-size:11px;color:var(--muted);align-self:center">unknown</span>
    </div>
  </div>

  <!-- ── Display ── -->
  <div class="section">
    <div class="section-title">Display</div>
    <div class="field">
      <label>Width</label>
      <input type="number" id="disp-width" min="200" max="3840">
    </div>
    <div class="field">
      <label>Height</label>
      <input type="number" id="disp-height" min="200" max="2160">
    </div>
    <div class="field">
      <label>On Top</label>
      <div class="toggle active" id="tog-atop"></div>
    </div>
    <div class="field">
      <label>Click Thru</label>
      <div class="toggle active" id="tog-clickthru"></div>
    </div>
    <div class="field">
      <label>DevTools</label>
      <div class="toggle" id="tog-devtools"></div>
    </div>
  </div>

  <!-- ── Model ── -->
  <div class="section">
    <div class="section-title">Model</div>
    <div class="field">
      <label>Path</label>
      <input type="text" id="model-path" disabled>
    </div>
    <div class="note">Changes to model path require app restart.</div>
    <div style="margin-top:8px;font-size:12px;color:var(--text2);margin-bottom:4px">Test Expression:</div>
    <div class="btn-row">
      <button class="expr-btn" data-expr="smile">😊 smile</button>
      <button class="expr-btn" data-expr="sad">😢 sad</button>
      <button class="expr-btn" data-expr="neutral">😐 neutral</button>
      <button class="expr-btn" data-expr="surprised">😲 surprised</button>
      <button class="expr-btn" data-expr="blush">😳 blush</button>
    </div>
  </div>

  <!-- ── About ── -->
  <div class="section">
    <div class="section-title">About</div>
    <div class="info-row"><span class="lbl">App</span><span class="val">OpenHeart v4.5.0</span></div>
    <div class="info-row"><span class="lbl">Client</span><span class="val">Electron L2D</span></div>
    <div class="info-row"><span class="lbl">Model</span><span class="val" id="about-model">xiaoyue</span></div>
  </div>

</div>

<div id="toast"></div>

<script src="config_renderer.js"></script>
</body>
</html>
