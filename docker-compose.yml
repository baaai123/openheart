# OpenHeart Docker Compose — Full Stack v5.x
# v5.x: OpenHeart service, Redis, Frontend
# Requires nvidia-container-toolkit for GPU passthrough

services:

  # ──────────────────────────────────────────────────────────────────
  # Redis ≥7 — Hot Memory + State Bus (§3.2.1 – §3.2.3)
  # Stores: Scene JSON, entity Hash, context List, sync_queue Stream,
  #         moments, entity_graph, pending rules, health heartbeats
  # ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: openheart-redis
    restart: unless-stopped
    profiles: ["infra"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --auto-aof-rewrite-percentage 100
        --auto-aof-rewrite-min-size 64mb
        --save ""
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openheart-net

  # ──────────────────────────────────────────────────────────────────
  # LanceDB ≥0.6 — Cold Memory, persistent data volume (§3.3)
  # LanceDB runs in-process as a Python library — this container
  # exists only to provide a persistent volume for /data/lancedb.
  # ──────────────────────────────────────────────────────────────────
  lancedb:
    image: alpine:3.19
    container_name: openheart-lancedb
    restart: unless-stopped
    profiles: ["infra"]
    command: >
      sh -c 'mkdir -p /data/lancedb && while true; do sleep 3600; done'
    volumes:
      - lancedb-data:/data/lancedb
    healthcheck:
      test: ["CMD", "test", "-d", "/data/lancedb"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openheart-net

  # ──────────────────────────────────────────────────────────────────
  # OpenHeart — Main application service
  # Builds from Dockerfile, mounts models cache, passes GPU
  # ──────────────────────────────────────────────────────────────────
  openheart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openheart-app
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "9876:9876"
      - "8080:8080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENHEART_MODE=${OPENHEART_MODE:-mock}
      - OPENHEART_VRAM_TIER=${OPENHEART_VRAM_TIER:-auto}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./rules:/app/rules:ro
      - openheart-cache:/app/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openheart-net

  # ──────────────────────────────────────────────────────────────────
  # Frontend — Nginx serving control panel
  # Serves frontend/index.html on port 80
  # ──────────────────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: openheart-frontend
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - openheart
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openheart-net

volumes:
  redis-data:
    name: openheart-redis-data
    driver: local
  lancedb-data:
    name: openheart-lancedb-data
    driver: local
  openheart-cache:
    name: openheart-cache
    driver: local

networks:
  openheart-net:
    name: openheart-net
    driver: bridge
